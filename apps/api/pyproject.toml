[project]
name = "apm-api"
version = "0.1.0"
description = "APM Digital API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "httpx2>=2.0",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "S", "C4"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# Migrations build DDL from module constants (table and column names), never from input.
"migrations/**" = ["S608"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "migrations", "tests"]
